<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/duty-swap-app/manifest.json" />
    <link rel="apple-touch-icon" href="/duty-swap-app/icon.jpg" />
    <title>Duty Swap</title>
    <script>
      if (location.pathname.indexOf('/admin') !== -1) {
        var mf = document.querySelector('link[rel="manifest"]');
        if (mf) mf.setAttribute('href', '/duty-swap-app/manifest-admin.json');
      }
    </script>
    <script>
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(function() {});
      }
      // GitHub Pages SPA redirect
      (function() {
        var p = window.location.search.slice(1);
        if (p.indexOf('p=') === 0) {
          var path = decodeURIComponent(p.slice(2));
          window.history.replaceState(null, null, '/' + path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
